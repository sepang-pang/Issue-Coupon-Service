<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <!--Viewport-->
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum=scale-1.0, minimum=scale-1.0">

    <!--(IE10)-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Nomalize -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"/>

    <!-- Boot Strap-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
            integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
            crossorigin="anonymous"></script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/48e8469b97.js" crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
    <title>Coukyrun - 쿠폰 조회</title>
    <link rel="icon" href="/images/title-logo-512.png" type="image/png">
</head>
<body>
<!-- 네비게이션 바 설정 -->
<header>
    <div th:replace="fragments/nav-bar-1st :: navbarFragment"></div>
    <div class="container d-flex flex-wrap justify-content-end">
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-display="static"
                    data-bs-toggle="dropdown" aria-expanded="false" th:text="${category}" style="width: 200px">
                조회 선택
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/admin/coupons">전체 쿠폰 조회</a></li>
                <li><a class="dropdown-item" href="/admin/coupons/upcoming">오픈 예정 쿠폰 조회</a></li>
                <li><a class="dropdown-item" href="/admin/coupons/closed">마감 쿠폰 조회</a></li>
            </ul>
        </div>
    </div>
</header>
<div class="container d-flex flex-column full-height full-width bg-custom">
    <div class="album py-5 bg-transparent">
        <div class="container">
            <div class="d-flex justify-content-center text-center mt-5" th:if="${count == 0}">
                <div class="d-flex justify-content-center align-items-center p-3 bg-white bg-opacity-50 rounded-3 shadow"
                     style="width: 70%; height: 300px;">
                    <h2 class="fw-normal">쿠폰이 존재하지 않습니다. 😅</h2>
                </div>
            </div>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                <div th:each="coupon : ${coupons} " class="col">
                    <div th:classappend="${coupon.couponStatus.name() == 'ACTIVE' ? 'neon-border' : ''}">
                        <div class="card shadow-sm">
                            <img class="p-2" width="100%" height="225" th:src="${coupon.couponImage}" alt="쿠폰 이미지">
                            <div class="card-body d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-center mt-auto">
                                    <h2 th:text="${coupon.couponName}" class="fw-normal">쿠폰 이름</h2>
                                    <span th:switch="${coupon.validityStatus.description}">
                                    <span th:case="'만료'" class="badge bg-danger"
                                          th:text="${coupon.validityStatus.description}"></span>
                                    <span th:case="'만료 임박'" class="badge bg-warning"
                                          th:text="${coupon.validityStatus.description}"></span>
                                    <span th:case="'유효'" class="badge bg-success"
                                          th:text="${coupon.validityStatus.description}"></span>
                                </span>
                                </div>
                                <p th:text="${coupon.couponContent}" class="card-text">쿠폰 내용</p>
                                <div class="d-flex justify-content-between align-items-center mt-auto">
                                    <small class="text-body-secondary mb-3"><span>재고 : </span>
                                        <span th:text="${coupon.remainQuantity}">100</span>
                                        <span> / </span>
                                        <span th:text="${coupon.totalQuantity}">100</span>
                                        <span>장</span>
                                    </small>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mt-auto">
                                    <small class="text-body-secondary">쿠폰 생성일
                                        <span th:text="${#temporals.format(coupon.createdAt, 'yyyy-MM-dd')}"></span>
                                    </small>
                                    <small class="text-body-secondary">쿠폰 만료일
                                        <span th:text="${#temporals.format(coupon.expiredAt, 'yyyy-MM-dd')}"></span>
                                    </small>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mt-auto">
                                    <small class="text-body-secondary">오픈 예정일
                                        <span th:text="${#temporals.format(coupon.openAt, 'yyyy-MM-dd')}"></span>
                                    </small>
                                    <small class="text-body-secondary">쿠폰 마감일
                                        <span th:text="${#temporals.format(coupon.closedAt, 'yyyy-MM-dd')}"></span>
                                    </small>
                                </div>
                                <div class="d-flex align-items-center justify-content-end gap-2 mt-3">
                                    <button type="button" class="btn btn-primary"
                                            th:onclick="'location.href=\'/admin/update-coupon/' + ${coupon.couponId} + '\' '">수정</button>
                                    <button type="button" class="btn btn-danger"
                                            data-bs-toggle="modal"
                                            data-bs-target="#modalChoice"
                                            th:data-coupon-id="${coupon.couponId}">삭제</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <nav class="d-flex justify-content-center" aria-label="Page navigation" th:if="${count > 0} ">
            <ul class="pagination mt-5">
                <!-- 처음 페이지로 이동: 첫 번째 그룹에서는 항상 렌더링, 2페이지 이상에서 활성화 -->
                <li class="page-item" th:if="${paginationUtils.totalGroups > 1 || paginationUtils.currentPage > 1}">
                    <a class="page-link" th:href="@{${baseUri}(page=0)}"
                       aria-label="First"
                       th:classappend="${paginationUtils.currentPage == 1 ? 'disabled' : ''}">
                        <i class="fa-solid fa-angles-left"></i>
                    </a>
                </li>

                <!-- 이전 페이지 그룹으로 이동: 첫 번째 그룹에서는 렌더링되지만 비활성화 -->
                <li class="page-item" th:if="${paginationUtils.totalGroups > 1}"
                    th:classappend="${paginationUtils.isFirstGroup ? 'disabled' : ''}">
                    <a class="page-link"
                       th:href="@{${baseUri}(page=${paginationUtils.isFirstGroup ? paginationUtils.currentPage - 1 : paginationUtils.startPage - 2})}"
                       aria-label="Previous Group">
                        <i class="fa-solid fa-angle-left"></i>
                    </a>
                </li>

                <!-- 페이지 번호 표시 -->
                <li th:each="i : ${#numbers.sequence(paginationUtils.startPage, paginationUtils.endPage)}"
                    th:class="${i == paginationUtils.currentPage ? 'page-item active' : 'page-item'}">
                    <a class="page-link" th:href="@{${baseUri}(page=${i - 1})}"
                       th:text="${i}"></a>
                </li>

                <!-- 다음 페이지 그룹으로 이동 -->
                <li class="page-item" th:if="${!paginationUtils.isLastGroup}">
                    <a class="page-link"
                       th:href="@{${baseUri}(page=${paginationUtils.endPage})}"
                       aria-label="Next Group">
                        <i class="fa-solid fa-angle-right"></i>
                    </a>
                </li>

                <!-- 마지막 페이지로 이동 -->
                <li class="page-item" th:if="${!paginationUtils.isLastGroup}">
                    <a class="page-link"
                       th:href="@{${baseUri}(page=${paginationUtils.totalPages - 1})}"
                       aria-label="Last">
                        <i class="fa-solid fa-angles-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- footer -->
<footer class="py-3 my-4 mt-0 mb-0 bg-light">
    <p class="text-center text-body-secondary" style="font-size: 15px;">&copy; 2024 COUPON SERVICE. All rights
        reserved.</p>
</footer>

<!-- modal -->
<div class="modal fade p-4 py-md-5" id="modalChoice" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content rounded-3 shadow">
            <div class="modal-body p-4 text-center">
                <h5 class="mb-0">쿠폰을 삭제하시겠습니까 ?</h5>
            </div>
            <div class="modal-footer flex-nowrap p-0">
                <button type="button"
                        class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0 border-end"
                        id="confirmDelete">
                    <strong>예</strong></button>
                <button type="button" class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0"
                        data-bs-dismiss="modal">아니오</button>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/js/script.js"></script>
</html>
